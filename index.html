<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Web Sockets</title>
</head>

<body>
    <p>This is a very basic web page to test Web Sockets functionality.</p>
    <p id="websocket-data"></p>
    <input type="text" id="input-field" placeholder="Type something and press enter" />
</body>

</html>

<script>
    const socket = new WebSocket("ws://localhost:3000");

    socket.addEventListener("message", (event) => {
        const dataElement = document.getElementById("websocket-data");
        dataElement.textContent = event.data;
    });

    const inputField = document.getElementById("input-field");
    inputField.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
            socket.send(inputField.value);
            inputField.value = "";
        }
    });
</script>
